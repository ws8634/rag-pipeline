[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_rag_pipeline"
version = "0.1.0"
description = "A reference RAG pipeline for local testing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "numpy>=1.21",
    "faiss-cpu>=1.7.0",
    "pytest>=7.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0",
]
all = [
    "openai>=1.0",
]

[project.scripts]
rag = "llm_rag_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
